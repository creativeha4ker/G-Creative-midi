- name: Build Debug APK
  run: |
    set -o pipefail

    if [ -f "./gradlew" ]; then
      chmod +x ./gradlew
      ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
    else
      gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
    fi

- name: Show build error
  if: failure()
  run: |
    echo "========== BUILD ERROR =========="
    grep -n -B 10 -A 30 -E "What went wrong|Execution failed|Caused by:|error:" build.log || true
    echo "========== END BUILD ERROR =========="